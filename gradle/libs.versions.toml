[versions]
aws-sdk = "[2.27.21, 2.28.0)"
aws-lambda-core = "[1.2.2, 1.3.0)"
aws-lambda-events = "[3.11.1, 3.12.0)"
aws-lambda-ric = "[2.9.0, 3.0.0)"
google-oauth2 = "[1.33.1, 1.34.0)"
graalvm = "[0.11.4, 0.12.0)"
kotlin = "[2.0.20, 2.1.0)"
kotlinx-coroutines = "[1.10.2, 1.11.0)"
jackson = "[2.18.3, 2.19.0)"
jakarta = "[2.1.5, 2.2.0)"
ktor = "[3.0.0, 3.1.0)"
logback = "[1.5.18, 1.6.0)"
slf4j = "[2.0.17, 2.1.0)"
spring-boot = "[3.4.4, 3.5.0)"
spring-shell = "[3.4.0, 3.5.0)"
auth0-jwt = "[4.4.0, 4.5.0)"
cron-utils = "[9.2.1, 9.3.0)"

[libraries]
aws-lambda-core = { group = "com.amazonaws", name = "aws-lambda-java-core", version.ref = "aws-lambda-core" }
aws-lambda-events = { group = "com.amazonaws", name = "aws-lambda-java-events", version.ref = "aws-lambda-events" }
aws-lambda-ric = { group = "com.amazonaws", name = "aws-lambda-java-runtime-interface-client", version.ref = "aws-lambda-ric" }
aws-sdk-dependencies = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
graalvm-native-plugin = { module = "org.graalvm.buildtools:native-gradle-plugin", version.ref = "graalvm" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
jackson-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin", version.ref = "jackson" }
jackson-yaml = { group = "com.fasterxml.jackson.dataformat", name = "jackson-dataformat-yaml", version.ref = "jackson" }
jakarta-mail = { group = "jakarta.mail", name = "jakarta.mail-api", version.ref = "jakarta" }
kotlin-spring = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
ktor-dependencies = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio" }
ktor-client-json = { group = "io.ktor", name = "ktor-client-json" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
spring-gradle = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
google-oauth2 = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "google-oauth2" }
spring-shell-dependencies = { module = "org.springframework.shell:spring-shell-dependencies", version.ref = "spring-shell" }

[bundles]
ktor-client = ["ktor-client-content-negotiation", "ktor-client-core", "ktor-client-cio", "ktor-client-json", "ktor-client-logging", "ktor-serialization-kotlinx-json"]
aws-lambda = ["aws-lambda-core", "aws-lambda-events", "aws-lambda-ric"]

[plugins]
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spring-gradle = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependencies = { id = "io.spring.dependency-management", version = "1.1.7" }

